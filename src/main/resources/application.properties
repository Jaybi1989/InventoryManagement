# Server-Einstellungen
server.port=${PORT:8080}
logging.level.org.atmosphere = warn
spring.mustache.check-template-location = false

logging.level.org.springframework.security=DEBUG
logging.level.com.vaadin.flow.router.internal=DEBUG
logging.level.com.vaadin.flow.router=WARN

# Vaadin Einstellungen
vaadin.launch-browser=true
vaadin.allowed-packages = com.vaadin,org.vaadin,ch.jacqueline.inventory


# Datenbank Konfiguration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3308/machinepark_inventory}
spring.datasource.username=app_user
spring.datasource.password=app_password
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.database=mysql
logging.level.org.mariadb.jdbc=DEBUG


# Hibernate / JPA Einstellungen
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.properties.hibernate.globally_quoted_identifiers_skip_column_definitions=true
spring.jpa.properties.hibernate.auto_quote_keyword=true
spring.jpa.hibernate.ddl-auto=update

#Cache leeren
spring.web.resources.cache.cachecontrol.max-age=0
spring.web.resources.cache.period=0

# Datenbank-Initialisierung
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jackson.date-format= dd.MM.yyyy
spring.jackson.time-zone= Europe/Zurich


spring.mail.host=asmtp.mail.hostpoint.ch
spring.mail.port=587
spring.mail.username= noreply@example.ch
spring.mail.password= doyourpassword
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


logging.level.ch.jacqueline=DEBUG

