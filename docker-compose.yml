services:
  db:
    image: mariadb:latest
    container_name: inventory-db
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: machinepark_inventory
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network

  web:
    container_name: machinepark-inventory
    build:
      context: .
    image: machinepark:1.0.0
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://db:3306/machinepark_inventory
      SPRING_DATASOURCE_USERNAME: app_user
      SPRING_DATASOURCE_PASSWORD: app_password
      APP_ENCRYPTION_AES_KEY: R7t/xbyYAUG0uyWMZvIdhsHK8iXufbC2typ4EWB8KeQ=
      APP_ENCRYPTION_HMAC_KEY: sg1HXjRZVHrYjPCNHyHnErSPo3/GP9CX1PGUsL1xBVM=
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
    driver: local